{% extends 'base.html' %}

{% block style %}
<link rel="stylesheet" href={{url_for('static',filename='login/login.css')}}>
{% endblock %}

{% block title %}Break Time: Login{% endblock %}

{% block Container %}
<div id="formContainer">
 
<form action="" method="Post" accept-charset="utf-8">
    <div id="loginblock">
        <legend>Login</legend>
        <div class="inputfield" id="telephonefield">
            <img src={{url_for('static', filename='src/profile.svg')}} alt="" />
            <p class="errordisplay">error</p>
            <input type="tel" name="tel" id="" value="" required placeholder="" />
            <label for="tel">Mobile Number</label>
        </div> 
        
        <div class="inputfield" id="passwordfield">
            <p class="errordisplay">error</p>
            <img src={{url_for('static', filename='src/bx-lock.svg')}} alt="" />
            <input type="password" name="pass" id="" value="" required placeholder=""/>
            <label for="pass">Password</label>
        </div>
        <p>
            <a href="#">forgot Password !</a>
        </p>
        <button type="submit">Login</button>
        </div>
    <div id="othersignup">
        <p>login with other</p>
        <div>
            <a href="#"> 
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="Github"/>
    </a>
        <a href="#">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/1024px-Google_Favicon_2025.svg.png?20250526093708" alt="Google"/>
    </a>
            <a href="#">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/cd/Facebook_logo_%28square%29.png" alt="Facebook"/>
    </a>
        </div>

    </div>
    <div>
        <p>NEW USER</p>
        <p><a href="{{url_for('signup')}}">Ragister Now</a></p>
    </div>
</form>
</div>
{% endblock %}
