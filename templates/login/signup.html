<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Time :Order food</title>
    
    <!-- Application Name -->
    <meta name="apple-mobile-web-app-title" content="It's Break Time">
    <meta name="application-name" content="Break Time">
    <link rel="manifest" href={{url_for('static',filename='manifest.json')}}>
    
    <link rel="icon" href="../static/src/logo.jpg" type="image/jpg">
    
    <link rel="stylesheet" href={{url_for('static',filename='login/signup.css')}}>
</head>


<body>
    <div class="">
    <legend>Signup</legend>
    <form id="signup" action="#" method="post">
    <div id="progressBar">
        <div id="progressLine"></div>
        <ul>
            <li class="current">Number</li>
            <li>Name</li>
            <li>College info</li>
            <li>Password</li>
        </ul>
    </div>
    <div id="stepContainer">
        <!-- Step 1-->
        <div class="steps current">
            <div class="inputbox">
                <input type="email" name="email" id="Email" value="" placeholder=""/>
                <label for="">Email</label>
            </div>

            <div class="inputbox">
                <input type="tel" name="tel" id="" value="" placeholder="" required/>
                <label for="tel">Mobile Number</label>
            </div>
            <div id="otp" class="inputbox">
                <input type="tel" name="tel" id="" placeholder=""value="" />
                <label for="tel">OTP</label>
            </div>
        </div>
        <!-- Step 2-->
        <div class="steps">
            <div class="inputbox">
                <input type="text" name="fname" id="" value="" placeholder=""required />
                <label for="fname">First Name :</label>
            </div>

            <div class="inputbox">
                <input type="text" name="mname" id="MName" value="" placeholder=""/>
                <label for="MName">Middle Name</label>
            </div>
            <div id="otp" class="inputbox">
                <input type="text" name="lname" id="LName" value="" placeholder="" required />
                <label for="LName">Last Name</label>
            </div>
        </div>
        
        <div class="steps">
            <div class="inputoption">
                <label for="Department">Department</label>
                <select name="departmentid" id="Department" required>
                    <option value="1">BCA</option>
                    <option value="0">BBA</option>
                </select>
            </div>
            <div class="inputoption">
                <label for="Department">Semister</label>
                <select name="semid" id="semister" required>
                    <option value="1">1st</option>
                    <option value="0">2nd</option>
                </select>
            </div>
            <div class="inputoption">
                <label for="Department">Section</label>
                <select name="sectionid" id="Section" required>
                    <option value="1">A</option>
                    <option value="2">B</option>
                </select>
            </div>
        </div>
        <div class="steps">
            <div class="inputbox">
                <input type="password" name="pass" id="" value="" placeholder=""required />
                <label for="password">Password</label>
            </div>
            <div class="inputbox">
                <input type="password" name="pass" id="" value="" placeholder="" required/>
                <label for="password">Confirm Password</label>
            </div>
        </div>
    </div>
    <!--Controls-->
    <div id="buttonContainer">
        <button id="priviousBtn" type="button">Privious</button>
        <button id="nextBtn"type="button">Next</button>
        <button id="submitBtn"type="submit">Submit</button>
    </div>
    </form>
    </div>
<script src={{url_for('static',filename='login/signup.js')}} type="text/javascript" charset="utf-8"></script>
</body>
</html>
